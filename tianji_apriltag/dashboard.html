<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AprilTag · 相机 6 / 7</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111820;color:#e7eef6}body{margin:0;padding:24px;max-width:1600px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:25px;margin:0}p{color:#9aacc0;font-size:14px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:20px}.card{background:#1b2531;border:1px solid #304052;border-radius:14px;overflow:hidden}.top{padding:16px;display:flex;justify-content:space-between;align-items:center}h2{font-size:18px;margin:0}.status{font-size:13px;color:#f5c572}.live{color:#76dfb5}.image{background:#090e14;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative}.image img{width:100%;height:100%;object-fit:contain}.image .placeholder{color:#8397ae}.image .overlay{position:absolute;inset:0;display:none;place-items:center;background:#090e14aa;color:#f5c572}.details{padding:16px;min-height:110px}.tag{padding:12px 0;border-bottom:1px solid #304052}.tag:first-child{padding-top:0}.tag:last-child{border:0}.tag b{color:#76dfb5}.error{color:#f5c572;overflow-wrap:anywhere;font-size:13px}.separation{padding:11px 12px;margin-bottom:12px;border-radius:8px;background:#294858;color:#e7fbff;font-weight:700}.metrics{display:flex;gap:20px;flex-wrap:wrap;margin-top:8px;font-size:14px}.sub{color:#9aacc0;font-size:12px;margin-top:8px}.offline{color:#f5c572}button{background:#273b50;color:#dce8f5;border:1px solid #49627b;border-radius:7px;padding:8px 12px;cursor:pointer}
</style>
<header><h1>AprilTag 实时识别</h1><button id="pause">暂停画面</button></header>
<p>tag36h11 · ID 18 / 34 mm · ID 19 / 24 mm · PDF 中心距 55 mm<br>位姿以各相机为参考；图像尺寸与标定不符时显示错误。</p>
<div id="connection" role="status"></div><main class="grid" id="cameras"></main>
<script>
const cards=new Map();let paused=false;
const el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x};
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'继续画面':'暂停画面'};
function card(id){if(cards.has(id))return cards.get(id);const root=el('section',undefined,'card'),top=el('div',undefined,'top');top.append(el('h2',`相机 ${id}${id===6?' · 左腕':id===7?' · 右腕':''}`));const status=el('span','','status');top.append(status);const frame=el('div',undefined,'image'),placeholder=el('span','等待相机画面','placeholder'),img=el('img');img.alt=`相机 ${id} 标注画面`;img.hidden=true;const overlay=el('div','','overlay');frame.append(placeholder,img,overlay);const details=el('div',undefined,'details');root.append(top,frame,details);document.querySelector('#cameras').append(root);const c={root,status,placeholder,img,details,overlay,loading:false};img.onload=()=>{c.loading=false;img.hidden=false;placeholder.hidden=true};img.onerror=()=>{c.loading=false;img.hidden=true;placeholder.hidden=false};cards.set(id,c);return c}
function render(data){for(const r of data.cameras){const c=card(r.camera),live=r.status==='live';c.status.textContent=({live:'实时',waiting:'等待相机',stale:'画面已过期',error:'处理异常'})[r.status]||r.status;c.status.className='status'+(live?' live':'');c.overlay.style.display=r.status==='stale'||r.status==='error'?'grid':'none';c.overlay.textContent=r.status==='stale'?'相机已断流 · 上次画面':'图像处理异常';c.details.replaceChildren();if(r.error)c.details.append(el('p',r.error,'error'));if(!live){c.details.append(el('p',r.age_s==null?'请确认相机驱动已启动。':`上次更新：${r.age_s.toFixed(1)} 秒前；下列为上次结果。`));}if(r.tag_center_distance_m!==undefined)c.details.append(el('div',`连线中点深度：${r.tag_pair_midpoint_depth_m.toFixed(3)} m · 中心距：${(r.tag_center_distance_m*1000).toFixed(1)} mm · PDF 55.0 mm`,'separation'));else c.details.append(el('div','18 ↔ 19 中心距：等待同帧识别','separation'));if(!r.tags.length)c.details.append(el('p',live?'当前未检测到 ID 18 / 19':'等待新的识别结果'));for(const t of r.tags){const row=el('div',undefined,'tag');row.append(el('b',`ID ${t.id} · ${(t.size_m*1000).toFixed(0)} mm`));if(t.translation_m){const metrics=el('div',undefined,'metrics');metrics.append(el('span',`距离 ${t.distance_m.toFixed(3)} m`),el('span',`深度 ${t.translation_m[2].toFixed(3)} m`));row.append(metrics,el('div',`XYZ [m]：${t.translation_m.map(x=>x.toFixed(4)).join(' / ')} · 重投影误差 ${t.reprojection_error_px.toFixed(2)} px`,'sub'));}else row.append(el('p',`位姿不可用：${t.pose_error||'无有效标定'}`,'error'));c.details.append(row)}if(!paused&&r.age_s!==null&&!c.loading){c.loading=true;c.img.src=`camera/${r.camera}.jpg?t=${Date.now()}`}}}
async function poll(){try{const response=await fetch('api/state',{cache:'no-store',signal:AbortSignal.timeout(2500)});if(!response.ok)throw Error(response.status);render(await response.json());document.querySelector('#connection').textContent=''}catch(e){document.querySelector('#connection').textContent='服务连接中断，正在重试…';document.querySelector('#connection').className='offline';for(const c of cards.values()){c.status.textContent='服务离线';c.status.className='status';c.overlay.style.display='grid';c.overlay.textContent='服务离线 · 上次画面'}}finally{setTimeout(poll,200)}}poll();
</script>
</html>
